<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinancePro | Laporan Keuangan</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f3f6fb;
    color: #1e293b;
    padding: 25px;
}

.container {
    max-width: 1150px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.header h1 {
    font-size: 27px;
    color: #172b4d;
}

.header p {
    color: #64748b;
    margin-top: 6px;
}

.header-label {
    background: #e0f2fe;
    color: #0369a1;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.04);
    border: 1px solid #edf0f5;
}

.stat-card p {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 12px;
}

.stat-card h2 {
    font-size: 22px;
    color: #172b4d;
    word-break: break-word;
}

.green { color: #16a34a !important; }
.red { color: #dc2626 !important; }
.blue { color: #2563eb !important; }

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.04);
    margin-bottom: 22px;
    border: 1px solid #edf0f5;
}

.panel h3 {
    margin-bottom: 20px;
    color: #172b4d;
}

form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group label {
    font-size: 13px;
    font-weight: 600;
    color: #475569;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #dce3ed;
    border-radius: 9px;
    outline: none;
    background: white;
    font-size: 14px;
}

input:focus, select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px #dbeafe;
}

.full {
    grid-column: 1 / -1;
}

button {
    border: none;
    padding: 12px 17px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 600;
    transition: .2s;
}

button:hover {
    opacity: .85;
    transform: translateY(-1px);
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-excel {
    background: #15803d;
    color: white;
}

.btn-print {
    background: #475569;
    color: white;
}

.btn-danger {
    background: #fee2e2;
    color: #dc2626;
}

.btn-edit {
    background: #dbeafe;
    color: #1d4ed8;
    padding: 7px 10px;
}

.btn-delete {
    background: #fee2e2;
    color: #dc2626;
    padding: 7px 10px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.toolbar input,
.toolbar select {
    max-width: 220px;
}

.actions {
    display: flex;
    gap: 8px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th {
    background: #f1f5f9;
    color: #475569;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .4px;
}

td, th {
    padding: 15px 12px;
    text-align: left;
    border-bottom: 1px solid #edf0f5;
    font-size: 13px;
}

td:last-child, th:last-child {
    text-align: center;
}

.badge {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.badge-masuk {
    background: #dcfce7;
    color: #15803d;
}

.badge-keluar {
    background: #fee2e2;
    color: #dc2626;
}

.empty {
    text-align: center !important;
    color: #94a3b8;
    padding: 30px;
}

@media(max-width:800px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:550px) {
    body { padding: 12px; }
    .stats { gap: 10px; }
    .stat-card { padding: 15px; }
    .stat-card h2 { font-size: 17px; }
    form { grid-template-columns: 1fr; }
    .full { grid-column: auto; }
    .panel { padding: 16px; }
    .header h1 { font-size: 22px; }
}

@media print {
    body { background: white; padding: 0; }
    .no-print, form, .actions, .toolbar button,
    .toolbar input, .toolbar select { display: none !important; }
    .container { max-width: 100%; }
    .panel, .stat-card { box-shadow: none; }
    table { min-width: 100%; }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>FinancePro</h1>
            <p>Sistem Laporan Keuangan Harian</p>
        </div>
        <div class="header-label">● Financial Dashboard</div>
    </div>

    <div class="stats">

        <div class="stat-card">
            <p>Total Pemasukan</p>
            <h2 class="green" id="totalMasuk">Rp0</h2>
        </div>

        <div class="stat-card">
            <p>Total Pengeluaran</p>
            <h2 class="red" id="totalKeluar">Rp0</h2>
        </div>

        <div class="stat-card">
            <p>Saldo Akhir</p>
            <h2 class="blue" id="saldo">Rp0</h2>
        </div>

        <div class="stat-card">
            <p>Total Transaksi</p>
            <h2 id="jumlahTransaksi">0</h2>
        </div>

    </div>

    <div class="panel no-print">

        <h3 id="formTitle">+ Tambah Transaksi Baru</h3>

        <form id="formTransaksi">

            <div class="form-group">
                <label>Tanggal Transaksi</label>
                <input type="date" id="tanggal" required>
            </div>

            <div class="form-group">
                <label>Jenis Transaksi</label>
                <select id="jenis" required>
                    <option value="Pemasukan">Pemasukan</option>
                    <option value="Pengeluaran">Pengeluaran</option>
                </select>
            </div>

            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="keterangan"
                    placeholder="Contoh: Penjualan barang" required>
            </div>

            <div class="form-group">
                <label>Jumlah (Rp)</label>
                <input type="number" id="jumlah"
                    min="1" step="1" placeholder="Contoh: 50000" required>
            </div>

            <div class="full">
                <button type="submit" class="btn-primary" id="submitBtn">
                    Simpan Transaksi
                </button>
                <button type="button" class="btn-danger"
                    id="cancelEdit" onclick="batalEdit()" hidden>
                    Batal Edit
                </button>
            </div>

        </form>
    </div>

    <div class="panel">

        <div class="toolbar no-print">
            <h3>Riwayat Transaksi</h3>

            <div class="actions">
                <button class="btn-excel" onclick="exportExcel()">
                    ↓ Export Excel
                </button>

                <button class="btn-print" onclick="window.print()">
                    Cetak
                </button>
            </div>
        </div>

        <div class="toolbar no-print">

            <input type="text" id="search"
                placeholder="Cari transaksi...">

            <select id="filterJenis">
                <option value="">Semua Transaksi</option>
                <option value="Pemasukan">Pemasukan</option>
                <option value="Pengeluaran">Pengeluaran</option>
            </select>

            <input type="date" id="filterTanggal">

        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Tanggal</th>
                        <th>Keterangan</th>
                        <th>Jenis</th>
                        <th>Jumlah</th>
                        <th class="no-print">Aksi</th>
                    </tr>
                </thead>

                <tbody id="dataTransaksi"></tbody>
            </table>
        </div>

    </div>

    <p style="font-size:12px;color:#94a3b8;margin:20px 0">
        FinancePro © 2026 | Laporan Keuangan Harian
    </p>

</div>

<script>
const form = document.getElementById("formTransaksi");
const tbody = document.getElementById("dataTransaksi");

let transaksi = JSON.parse(
    localStorage.getItem("financeProData") || "[]"
);

let editId = null;

const rupiah = angka =>
    new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(angka);

function simpanStorage() {
    localStorage.setItem(
        "financeProData",
        JSON.stringify(transaksi)
    );
}

function render() {

    const totalMasuk = transaksi
        .filter(t => t.jenis === "Pemasukan")
        .reduce((a, b) => a + b.jumlah, 0);

    const totalKeluar = transaksi
        .filter(t => t.jenis === "Pengeluaran")
        .reduce((a, b) => a + b.jumlah, 0);

    document.getElementById("totalMasuk").textContent = rupiah(totalMasuk);
    document.getElementById("totalKeluar").textContent = rupiah(totalKeluar);
    document.getElementById("saldo").textContent = rupiah(totalMasuk - totalKeluar);
    document.getElementById("jumlahTransaksi").textContent = transaksi.length;

    const search = document.getElementById("search").value.toLowerCase();
    const jenis = document.getElementById("filterJenis").value;
    const tanggal = document.getElementById("filterTanggal").value;

    const hasil = transaksi.filter(t =>
        t.keterangan.toLowerCase().includes(search) &&
        (!jenis || t.jenis === jenis) &&
        (!tanggal || t.tanggal === tanggal)
    );

    tbody.replaceChildren();

    if (!hasil.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 6;
        cell.className = "empty";
        cell.textContent = "Belum ada transaksi ditemukan";
        row.appendChild(cell);
        tbody.appendChild(row);
        return;
    }

    hasil.forEach((t, index) => {

        const row = document.createElement("tr");

        const values = [
            index + 1,
            t.tanggal,
            t.keterangan
        ];

        values.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            row.appendChild(td);
        });

        const jenisCell = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = t.jenis === "Pemasukan"
            ? "badge badge-masuk"
            : "badge badge-keluar";
        badge.textContent = t.jenis;
        jenisCell.appendChild(badge);
        row.appendChild(jenisCell);

        const jumlahCell = document.createElement("td");
        jumlahCell.textContent =
            (t.jenis === "Pemasukan" ? "+" : "-") + rupiah(t.jumlah);
        jumlahCell.className =
            t.jenis === "Pemasukan" ? "green" : "red";
        row.appendChild(jumlahCell);

        const aksi = document.createElement("td");
        aksi.className = "no-print";

        const edit = document.createElement("button");
        edit.className = "btn-edit";
        edit.textContent = "Edit";
        edit.onclick = () => mulaiEdit(t.id);

        const hapus = document.createElement("button");
        hapus.className = "btn-delete";
        hapus.textContent = "Hapus";
        hapus.style.marginLeft = "5px";
        hapus.onclick = () => hapusTransaksi(t.id);

        aksi.append(edit, hapus);
        row.appendChild(aksi);

        tbody.appendChild(row);
    });
}

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const tanggal = document.getElementById("tanggal").value;
    const jenis = document.getElementById("jenis").value;
    const keterangan = document.getElementById("keterangan").value.trim();
    const jumlah = Number(document.getElementById("jumlah").value);

    if (!tanggal || !keterangan || !Number.isSafeInteger(jumlah) || jumlah <= 0) {
        alert("Mohon periksa kembali data transaksi.");
        return;
    }

    if (editId !== null) {
        const index = transaksi.findIndex(t => t.id === editId);
        if (index !== -1) {
            transaksi[index] = {
                id: editId, tanggal, jenis, keterangan, jumlah
            };
        }
        editId = null;
    } else {
        transaksi.push({
            id: Date.now() + Math.random(),
            tanggal, jenis, keterangan, jumlah
        });
    }

    simpanStorage();
    form.reset();
    document.getElementById("tanggal").value =
        new Date().toLocaleDateString("en-CA");
    document.getElementById("formTitle").textContent =
        "+ Tambah Transaksi Baru";
    document.getElementById("submitBtn").textContent =
        "Simpan Transaksi";
    document.getElementById("cancelEdit").hidden = true;

    render();
});

function mulaiEdit(id) {
    const t = transaksi.find(x => x.id === id);
    if (!t) return;

    editId = id;
    document.getElementById("tanggal").value = t.tanggal;
    document.getElementById("jenis").value = t.jenis;
    document.getElementById("keterangan").value = t.keterangan;
    document.getElementById("jumlah").value = t.jumlah;

    document.getElementById("formTitle").textContent =
        "Edit Transaksi";
    document.getElementById("submitBtn").textContent =
        "Perbarui Transaksi";
    document.getElementById("cancelEdit").hidden = false;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function batalEdit() {
    editId = null;
    form.reset();
    document.getElementById("tanggal").value =
        new Date().toLocaleDateString("en-CA");
    document.getElementById("formTitle").textContent =
        "+ Tambah Transaksi Baru";
    document.getElementById("submitBtn").textContent =
        "Simpan Transaksi";
    document.getElementById("cancelEdit").hidden = true;
}

function hapusTransaksi(id) {
    if (!confirm("Yakin ingin menghapus transaksi ini?")) return;

    transaksi = transaksi.filter(t => t.id !== id);

    simpanStorage();
    render();
}

function exportExcel() {

    if (typeof XLSX === "undefined") {
        alert("Library Excel belum tersedia. Periksa koneksi internet.");
        return;
    }

    if (!transaksi.length) {
        alert("Belum ada data untuk diekspor.");
        return;
    }

    const data = transaksi.map((t, i) => ({
        "No": i + 1,
        "Tanggal": t.tanggal,
        "Keterangan": t.keterangan,
        "Jenis": t.jenis,
        "Jumlah (Rp)": t.jumlah
    }));

    const totalMasuk = transaksi
        .filter(t => t.jenis === "Pemasukan")
        .reduce((a,b) => a + b.jumlah, 0);

    const totalKeluar = transaksi
        .filter(t => t.jenis === "Pengeluaran")
        .reduce((a,b) => a + b.jumlah, 0);

    data.push(
        {},
        { "Keterangan": "TOTAL PEMASUKAN", "Jumlah (Rp)": totalMasuk },
        { "Keterangan": "TOTAL PENGELUARAN", "Jumlah (Rp)": totalKeluar },
        { "Keterangan": "SALDO AKHIR", "Jumlah (Rp)": totalMasuk - totalKeluar }
    );

    const worksheet = XLSX.utils.json_to_sheet(data);
    worksheet["!cols"] = [
        { wch: 8 },
        { wch: 15 },
        { wch: 35 },
        { wch: 18 },
        { wch: 20 }
    ];

    const workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook, worksheet, "Laporan Keuangan"
    );

    const tanggal = new Date().toLocaleDateString("en-CA");

    XLSX.writeFile(
        workbook,
        "Laporan_Keuangan_" + tanggal + ".xlsx"
    );
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filterJenis").addEventListener("change", render);
document.getElementById("filterTanggal").addEventListener("change", render);

document.getElementById("tanggal").value =
    new Date().toLocaleDateString("en-CA");

render();
</script>

</body>
</html>
